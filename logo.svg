    <path d="M 215 278 L 246 276"/>
    <path d="M 215 286 L 246 284"/>
    <path d="M 266 268 L 297 270"/>
    <path d="M 266 276 L 297 278"/>
    <path d="M 266 284 L 297 286"/>
