    <circle cx="201" cy="224" r="6.5"/>
    <rect x="205.5" y="196" width="3.2" height="28"/>
    <path d="M 205.5 196 q 10 1.5 12 9 l 0 4 q -4 -7 -12 -8 Z"/>
  </g>

